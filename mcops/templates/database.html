{% extends "base.html" %}
{% block title %}Database – MCOps{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">🗄 Global Database</div>
        <div class="page-subtitle">Used for newly created servers to automatically configure plugins (e.g. LuckPerms).</div>
    </div>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <span class="card-title">MySQL / MariaDB Settings</span>
    </div>
    <div class="card-body">
        <form id="db-form">
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Host / IP</label>
                    <input type="text" class="form-control" name="db_host" id="db_host" value="{{ db_config.host }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Port</label>
                    <input type="number" class="form-control" name="db_port" id="db_port" value="{{ db_config.port }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Database Name</label>
                <input type="text" class="form-control" name="db_name" id="db_name" value="{{ db_config.name }}" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="db_user" id="db_user" value="{{ db_config.user }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="db_password" id="db_password" value="{{ db_config.password }}" required>
                </div>
            </div>

            <div id="db-result" style="margin-top:1rem"></div>

            <div style="display:flex; justify-content:space-between; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border)">
                <button type="button" class="btn btn-ghost" id="test-btn" onclick="testConnection()">🔌 Test Connection</button>
                <button type="button" class="btn btn-primary" id="save-btn" onclick="saveDatabase()">💾 Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function testConnection() {
    const btn = document.getElementById('test-btn');
    const result = document.getElementById('db-result');
    const fd = new FormData(document.getElementById('db-form'));
    
    btn.disabled = true;
    btn.textContent = 'Testing...';
    
    try {
        const res = await fetch('/database/test', { method: 'POST', body: fd });
        const data = await res.json();
        
        if (data.status === 'ok') {
            result.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
        } else {
            result.innerHTML = `<div class="alert alert-danger">❌ ${data.message}</div>`;
        }
    } catch (e) {
        result.innerHTML = `<div class="alert alert-danger">❌ Network error while testing.</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '🔌 Test Connection';
    }
}

async function saveDatabase() {
    const btn = document.getElementById('save-btn');
    const result = document.getElementById('db-result');
    const fd = new FormData(document.getElementById('db-form'));
    
    btn.disabled = true;
    btn.textContent = 'Saving...';
    
    try {
        const res = await fetch('/database/save', { method: 'POST', body: fd });
        const data = await res.json();
        
        if (data.status === 'ok') {
            result.innerHTML = `<div class="alert alert-success">✅ ${data.message}</div>`;
        } else {
            result.innerHTML = `<div class="alert alert-danger">❌ Save failed.</div>`;
        }
    } catch (e) {
        result.innerHTML = `<div class="alert alert-danger">❌ Network error while saving.</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save';
        setTimeout(() => { if(result.innerHTML.includes('alert-success')) result.innerHTML = ''; }, 4000);
    }
}
</script>
{% endblock %}
