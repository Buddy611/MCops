[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mcops-panel"
version = "2.0.0"
description = "Lightweight Minecraft server management panel – Pterodactyl alternative"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "libtmux>=0.28",
    "jinja2>=3.1",
    "cachetools>=5.3",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "aiofiles>=23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcops*"]
